carla:
  host: 127.0.0.1
  port: 2000
  timeout: 60.0
  map: Town05_Opt
  load_world_on_start: false
  synchronous_mode: false

traffic:
  mode: external
  source: carla_generate_traffic

environment:
  unload_foliage: true

station:
  id: RSU_001
  deployment: auto_cross_junction
  junction_index: 0
  height: 8.0
  lateral_offset: 7.0
  transform: {x: 0.0, y: 0.0, z: 8.0, pitch: 0.0, yaw: 0.0, roll: 0.0}

camera:
  id: CAM_01
  enabled: true
  width: 1280
  height: 720
  fov: 90
  transform: {x: 0.0, y: 0.0, z: 0.0, pitch: -20.0, yaw: 0.0, roll: 0.0}

camera_detection:
  enabled: true
  backend: yolov5_onnx_opencv
  model: models/yolov5n.onnx
  input_size: 640
  confidence: 0.35
  nms: 0.45

camera_fusion:
  source: carla_truth
  note: simulation-only adapter; replace with detector when RTSP camera backend is ready

camera_lidar_association:
  min_iou: 0.05
  max_center_distance: 120.0

lidar:
  enabled: true
  channels: 64
  range: 80.0
  points_per_second: 400000
  rotation_frequency: 10.0
  upper_fov: 5.0
  lower_fov: -35.0
  transform: {x: 0.0, y: 0.0, z: 0.5, pitch: 0.0, yaw: 0.0, roll: 0.0}

radar:
  enabled: true
  horizontal_fov: 80.0
  vertical_fov: 25.0
  range: 80.0
  transform: {x: 0.0, y: 0.0, z: 0.2, pitch: -5.0, yaw: 0.0, roll: 0.0}

fusion:
  ground_removal_enabled: true
  ground_clearance: 0.30

  # V0.5.5: high-mounted roadside LiDAR needs range-dependent clustering.
  # Near range keeps the strict geometry that already reached ~80% recall.
  # Mid/far bands progressively enlarge voxels and relax sparse-return thresholds.
  range_adaptive_clustering: true
  range_bands:
    - {max_range: 30.0, voxel_size: 0.50, min_points: 4, min_length: 0.40, min_width: 0.25, min_height: 0.15}
    - {max_range: 50.0, voxel_size: 0.65, min_points: 3, min_length: 0.30, min_width: 0.20, min_height: 0.12}
    - {max_range: 80.0, voxel_size: 0.90, min_points: 2, min_length: 0.20, min_width: 0.12, min_height: 0.08}

  # Fixed clustering values are retained as fallback when adaptive mode is disabled.
  voxel_size: 0.5
  cluster_min_points: 4
  lidar_min_z: -9.5
  lidar_max_z: 1.0
  max_range: 80.0
  vehicle_min_length: 0.4
  vehicle_max_length: 8.0
  vehicle_min_width: 0.25
  vehicle_max_width: 4.0
  vehicle_min_height: 0.15
  vehicle_max_height: 4.0
  max_objects: 120

  cluster_merge_enabled: true
  cluster_merge_gap: 1.2
  merged_vehicle_max_length: 14.0
  merged_vehicle_max_width: 4.2
  merged_vehicle_max_height: 4.2
  pole_short_max: 0.75
  pole_long_max: 2.5
  pole_height_min: 1.5

  radar_match_distance: 4.0
  radar_match_z: 2.5
  radar_min_hits: 1
  radar_velocity_alpha: 0.35

  track_match_distance: 3.5
  track_max_age: 1.5
  track_max_speed: 20.0
  velocity_alpha: 0.25
  velocity_window: 5
  position_alpha: 0.45
  stationary_speed: 0.35
  extent_alpha: 0.25
  extent_shrink_alpha: 0.05
  extent_lock_hits: 5

  road_roi_margin: 3.0
  road_min_height: -1.0
  road_max_height: 2.8

  # Disable the legacy startup occupancy filter while traffic is already present.
  # In the V0.5.4 logs it removed valid ROI-matched vehicles (4 -> 2) because
  # calibration occurred with live traffic in the scene. Ground removal + road ROI
  # are now the primary static rejection stages during CARLA evaluation.
  background_filter_enabled: false
  background_calibration_seconds: 6.0
  background_cell_size: 1.0
  background_occupancy_ratio: 0.45
  background_moving_radar_speed: 1.2
  background_neighbor_radius_cells: 2
  static_confirm_seconds: 3.0
  static_max_speed: 0.8

evaluation:
  enabled: true
  radius: 80.0
  range_bins: [30.0, 50.0, 80.0]
  match_distance: 4.0
  include_roles: [autopilot, roadside_autopilot, rsu_local_autopilot]
  report_interval: 2.0

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  topic_object_list: roadside/RSU_001/object_list
  topic_rsm: roadside/RSU_001/rsm
