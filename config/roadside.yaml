carla:
  host: 127.0.0.1
  port: 2000
  timeout: 60.0
  map: Town05_Opt
  # V0.6.12.8.2.2.31: main.py keeps an existing Town05 world, otherwise loads
  # Town05_Opt. Start traffic generators after main.py when a switch is needed.
  load_world_on_start: true
  synchronous_mode: false

traffic:
  mode: external
  source: carla_generate_traffic
  nearby_participant_warning_threshold: 10

environment:
  unload_foliage: true

station:
  id: RSU_001
  deployment: auto_cross_junction
  junction_index: 0
  height: 8.0
  lateral_offset: 7.0
  transform: {x: 0.0, y: 0.0, z: 8.0, pitch: 0.0, yaw: 0.0, roll: 0.0}

camera:
  id: CAM_01
  enabled: true
  width: 1280
  height: 720
  fov: 90
  transform: {x: 0.0, y: 0.0, z: 0.0, pitch: -20.0, yaw: 0.0, roll: 0.0}

# V0.6.12.8.2.2.50: two cameras cover the selected road axis in opposite
# directions. The legacy camera block remains as a tool-compatible fallback.
cameras:
  - id: CAM_NORTH
    enabled: true
    width: 1280
    height: 720
    fov: 90
    transform: {x: 0.0, y: 0.0, z: 0.0, pitch: -20.0, yaw: 0.0, roll: 0.0}
  - id: CAM_SOUTH
    enabled: true
    width: 1280
    height: 720
    fov: 90
    transform: {x: 0.0, y: 0.0, z: 0.0, pitch: -20.0, yaw: 180.0, roll: 0.0}

camera_detection:
  enabled: true
  backend: yolov5_onnx_auto
  model: models/yolov5n.onnx
  input_size: 640
  confidence: 0.35
  nms: 0.45

camera_fusion:
  source: carla_truth
  note: simulation-only adapter; replace with detector when RTSP camera backend is ready

camera_lidar_association:
  min_iou: 0.05
  max_center_distance: 120.0

lidar:
  enabled: true
  # V0.6.12.8.2.2.49: CARLA profile matched to RoboSense Fairy 48TX.
  # The first acceptance range remains 80m (10% reflectivity specification).
  channels: 48
  range: 80.0
  points_per_second: 690000
  rotation_frequency: 10.0
  upper_fov: 15.84
  lower_fov: -15.84
  near_coverage_reference_height: 1.70
  transform: {x: 0.0, y: 0.0, z: 0.5, pitch: 0.0, yaw: 0.0, roll: 0.0}

radar:
  enabled: true
  horizontal_fov: 80.0
  vertical_fov: 25.0
  range: 80.0
  transform: {x: 0.0, y: 0.0, z: 0.2, pitch: -5.0, yaw: 0.0, roll: 0.0}

fusion:
  ground_removal_enabled: true
  ground_clearance: 0.30

  # V0.6.12.8.2: a separate, temporally confirmed channel for compact low
  # road objects. The normal vehicle/VRU ground cut remains unchanged.
  road_object_recovery_enabled: true
  # V0.6.12.8.2.2.19: selected candidates retain provenance through ROI/Tracker.
  road_object_recovery_shadow_mode: false
  road_object_recovery_min_range: 5.0
  road_object_recovery_max_range: 45.0
  road_object_recovery_ground_clearance: 0.05
  road_object_recovery_max_height_above_ground: 1.50
  road_object_recovery_cell_size: 0.30
  road_object_recovery_neighbor_cells: 1
  road_object_recovery_min_points: 2
  road_object_recovery_max_points: 24
  road_object_recovery_min_length: 0.08
  road_object_recovery_max_length: 1.50
  road_object_recovery_min_width: 0.02
  road_object_recovery_max_width: 1.20
  road_object_recovery_min_height: 0.02
  road_object_recovery_max_height: 1.40
  road_object_recovery_temporal_frames: 2
  road_object_recovery_temporal_gate: 0.80
  road_object_recovery_dedupe_distance: 1.00
  road_object_recovery_max_candidates: 12
  # V0.6.12.8.2.2.3: parallel range-balanced Top-N selection. Shadow only;
  # baseline output remains the only recovery list seen by perception/tracking.
  road_object_recovery_balanced_cap_shadow: true
  road_object_recovery_balanced_bands:
    - {max_range: 25.0, quota: 4}
    - {max_range: 35.0, quota: 4}
    - {max_range: 45.0, quota: 4}
  # V0.6.12.8.2.2.4: range-adaptive multi-frame low-slice geometry. Shadow
  # only. Current-frame support is mandatory and points are voxel-deduplicated.
  road_object_recovery_adaptive_temporal_shadow: true
  road_object_recovery_adaptive_voxel_size: 0.08
  road_object_recovery_adaptive_temporal_bands:
    - {min_range: 25.0, max_range: 35.0, history_frames: 3, min_support_frames: 2, max_points: 48}
    - {min_range: 35.0, max_range: 45.0, history_frames: 4, min_support_frames: 3, max_points: 64}
  # V0.6.12.8.2.2.6: scalar low-object priority ranking, still Shadow only.
  road_object_recovery_adaptive_ranking_shadow: true
  road_object_adaptive_rank_low_height: 0.30
  road_object_adaptive_rank_mid_height: 0.75
  road_object_adaptive_rank_target_points: 5.0
  road_object_adaptive_rank_full_support_frames: 4
  # V0.6.12.8.2.2.8: reserve both low and elevated candidates per range band.
  road_object_recovery_adaptive_stratified_shadow: true
  road_object_adaptive_stratified_height: 0.30
  road_object_adaptive_stratified_elevated_quota: 2
  # V0.6.12.8.2.2.9: near Baseline plus far Adaptive Ranked, still Shadow only.
  road_object_recovery_adaptive_hybrid_shadow: true
  road_object_adaptive_hybrid_split_range: 25.0
  # V0.6.12.8.2.2.11: source-aware scalar admission gate, Shadow only.
  road_object_recovery_adaptive_hybrid_gate_shadow: true
  road_object_hybrid_gate_near_min_points: 8
  road_object_hybrid_gate_near_low_height: 0.45
  road_object_hybrid_gate_near_min_short_side: 0.50
  road_object_hybrid_gate_far_stable_frames: 4
  road_object_hybrid_gate_far_close_range: 32.0
  road_object_hybrid_gate_far_close_min_points: 5
  road_object_hybrid_gate_far_close_current_points: 2
  # V0.6.12.8.2.2.12: recover persistent sparse rejects in a second Shadow path.
  road_object_recovery_adaptive_hybrid_rescue_shadow: true
  road_object_hybrid_rescue_near_temporal_hits: 3
  road_object_hybrid_rescue_near_min_points: 5
  road_object_hybrid_rescue_far_max_range: 32.0
  road_object_hybrid_rescue_far_support_frames: 3
  road_object_hybrid_rescue_far_min_points: 4
  road_object_hybrid_rescue_far_current_points: 1
  # V0.6.12.8.2.2.17: multi-class geometry gate selected from moving-walker evidence, Shadow only.
  road_object_recovery_adaptive_hybrid_geometry_gate_shadow: true
  road_object_hybrid_geometry_gate_near_min_area: 0.02
  road_object_hybrid_geometry_gate_far_max_range: 32.0
  # V0.6.12.8.2.2.16: name the future output branch without enforcing it.
  road_object_recovery_selected_output_shadow: true
  road_object_recovery_selected_output_policy: adaptive_hybrid_geometry_gated
  road_object_recovery_selected_output_enforcing: true
  # V0.6.12.8.2.2.20: calculate the normally bypassed near-range score only.
  road_object_selected_admission_score_shadow: true
  # V0.6.12.8.2.2.21: safest observed gate retained 75/75 truth samples.
  road_object_selected_admission_score_enforcing: true
  road_object_selected_admission_score_threshold: 0.20
  # V0.6.12.8.2.2.26: profile counterfactual outcomes and their origin features.
  # Existing-track support must include a non-Selected geometry update.
  selected_track_admission_enabled: true
  selected_track_admission_shadow_mode: true
  selected_track_admission_required_frames: 2
  selected_track_admission_match_gate: 2.5
  selected_track_admission_track_gate: 4.0
  selected_track_admission_ttl: 0.5
  # V0.6.12.8.2.2.29: profile intermittent LiDAR reappearance with longer
  # sensor-only windows. Parallel state never filters or confirms real tracks.
  selected_track_admission_delayed_reappearance_shadow: true
  selected_track_admission_delayed_reappearance_ablations:
    - {name: ttl075_gate25, ttl: 0.75, match_gate: 2.5}
    - {name: ttl100_gate25, ttl: 1.00, match_gate: 2.5}
    - {name: ttl150_gate25, ttl: 1.50, match_gate: 2.5}
    - {name: ttl100_gate35, ttl: 1.00, match_gate: 3.5}
  # V0.6.12.8.2.2.33: operational shadow of the best low-risk combination
  # observed in v061282232(1).log. It only reports WouldKeep/WouldReject and
  # never confirms a candidate or changes Tracker/Fusion/ObjectList input.
  selected_delayed_reappearance_selected_rule: ttl075_gate25
  selected_delayed_reappearance_selected_risk_gate: {max_score: 0.40, max_origin_score: 0.40, max_points: 4, max_origin_points: 4, max_height: 0.25, max_apparent_speed: 0.50}

  range_adaptive_clustering: true
  range_bands:
    - {max_range: 30.0, mode: 3d, voxel_size: 0.40, min_points: 3, min_length: 0.25, max_length: 6.5, min_width: 0.12, max_width: 3.4, min_height: 0.30, max_height: 2.6}
    - {max_range: 50.0, mode: 3d, voxel_size: 0.65, min_points: 3, min_length: 0.30, min_width: 0.20, min_height: 0.12}
    - {max_range: 80.0, mode: bev_multiscale, bev_cell_sizes: [0.55, 0.85], bev_neighbor_cells: 1, bev_dedupe_distance: 1.40, min_points: 2, min_length: 0.18, min_width: 0.10, min_height: 0.07}

  voxel_size: 0.5
  cluster_min_points: 4
  lidar_min_z: -9.5
  lidar_max_z: 1.0
  max_range: 80.0
  vehicle_min_length: 0.4
  vehicle_max_length: 8.0
  vehicle_min_width: 0.25
  vehicle_max_width: 4.0
  vehicle_min_height: 0.15
  vehicle_max_height: 4.0
  max_objects: 140

  # V0.6.12.8: preserve compact VRU/road-obstacle geometry. Classification is
  # supplied by camera association when available; otherwise output is unknown_obstacle.
  pole_filter_enabled: false
  multiclass_compact_geometry_enabled: true
  multiclass_compact_max_length: 1.20
  multiclass_compact_max_width: 1.00
  multiclass_compact_max_height: 2.40
  multiclass_compact_score_bonus: 0.14

  cluster_merge_enabled: true
  cluster_merge_gap: 1.2
  merged_vehicle_max_length: 14.0
  merged_vehicle_max_width: 4.2
  merged_vehicle_max_height: 4.2

  near_merge_range: 30.0
  near_merge_gap: 0.65
  near_merged_vehicle_max_length: 7.5
  near_merged_vehicle_max_width: 3.2

  sparse_geometry_rescue_enabled: true
  sparse_geometry_rescue_min_range: 30.0
  sparse_geometry_rescue_max_range: 80.0
  sparse_geometry_rescue_far_range: 50.0
  sparse_geometry_rescue_min_track_hits: 3
  sparse_geometry_rescue_mid_min_quality: 0.55
  sparse_geometry_rescue_far_min_quality: 0.47
  sparse_geometry_rescue_mid_max_streak: 2
  sparse_geometry_rescue_far_max_streak: 3
  sparse_geometry_rescue_mid_radius: 2.2
  sparse_geometry_rescue_far_radius: 3.0
  sparse_geometry_rescue_z_window: 2.0
  sparse_geometry_rescue_dedupe_distance: 2.0
  sparse_geometry_rescue_mid_min_points: 3
  sparse_geometry_rescue_far_min_points: 2
  sparse_geometry_rescue_min_length: 0.18
  sparse_geometry_rescue_min_width: 0.08
  sparse_geometry_rescue_min_height: 0.05
  sparse_geometry_rescue_max_length: 7.5
  sparse_geometry_rescue_max_width: 3.5
  sparse_geometry_rescue_max_height: 3.0
  sparse_geometry_rescue_score_bonus: 0.08

  far_geometry_builder_enabled: true
  far_geometry_builder_min_range: 50.0
  far_geometry_builder_max_range: 80.0
  far_geometry_builder_cell_size: 1.0
  far_geometry_builder_neighbor_cells: 1
  far_geometry_builder_min_points: 2
  far_geometry_builder_min_length: 0.25
  far_geometry_builder_max_length: 7.5
  far_geometry_builder_min_width: 0.08
  far_geometry_builder_max_width: 3.5
  far_geometry_builder_min_height: 0.04
  far_geometry_builder_max_height: 3.2
  far_geometry_builder_dedupe_distance: 1.8
  far_geometry_builder_max_candidates: 30
  far_geometry_builder_oriented_extent_enabled: true

  # V0.6.12.4: current-frame seeded, short-term LiDAR-only far support.
  far_geometry_temporal_enabled: true
  far_geometry_temporal_ttl: 0.25
  far_geometry_temporal_frames: 2
  far_geometry_temporal_gate: 0.90
  far_geometry_temporal_z_gate: 1.20
  far_geometry_temporal_max_added: 12

  # V0.6.12.6: bridge only nearby undersized current-frame fragments.
  far_geometry_recovery_enabled: true
  far_geometry_recovery_bridge_distance: 3.0
  far_geometry_recovery_z_gate: 1.0
  far_geometry_recovery_max_fragments: 3
  far_geometry_recovery_min_current_points: 3
  far_geometry_recovery_max_fragment_points: 12
  far_geometry_recovery_fragment_max_height: 2.0
  far_geometry_recovery_max_candidates: 8

  # V0.6.12.6.1: weak three-point recovery needs independent evidence.
  far_recovery_quality_gate_enabled: true
  far_recovery_quality_min_current_points_without_support: 4
  far_recovery_quality_track_gate: 3.5
  far_recovery_quality_track_min_hits: 3
  far_recovery_quality_track_min_quality: 0.47

  # V0.6.12.7.1: observe the far admission decision without filtering Tracker input.
  far_track_admission_enabled: true
  far_track_admission_shadow_mode: true
  far_track_admission_min_range: 50.0
  far_track_admission_required_frames: 2
  far_track_admission_match_gate: 2.5
  far_track_admission_ttl: 0.5
  far_track_admission_track_gate: 3.5
  far_track_admission_track_min_hits: 2
  far_track_admission_strong_min_points: 10
  far_track_admission_strong_min_score: 0.72

  far_sparse_discovery_enabled: true
  far_sparse_discovery_min_range: 30.0
  far_sparse_discovery_max_range: 80.0
  far_sparse_discovery_far_range: 50.0
  far_sparse_discovery_mid_cell: 0.90
  far_sparse_discovery_far_cell: 1.20
  far_sparse_discovery_mid_min_points: 4
  far_sparse_discovery_far_min_points: 3
  far_sparse_discovery_dedupe_distance: 2.0
  far_sparse_discovery_max_candidates: 40
  far_sparse_discovery_min_length: 0.35
  far_sparse_discovery_max_length: 7.5
  far_sparse_discovery_min_width: 0.12
  far_sparse_discovery_max_width: 3.5
  far_sparse_discovery_min_height: 0.06
  far_sparse_discovery_max_height: 3.2

  pole_short_max: 0.75
  pole_long_max: 2.5
  pole_height_min: 1.5

  candidate_scoring_enabled: true
  candidate_scoring_min_range: 50.0
  candidate_scoring_threshold_far: 0.46
  candidate_scoring_far_relaxed_range: 65.0
  candidate_scoring_threshold_far_long: 0.42

  radar_match_distance: 4.0
  radar_match_z: 2.5
  radar_min_hits: 1
  radar_velocity_alpha: 0.35

  # V0.6.12.8.2.2.51: supplement the 48TX geometric blind zone with
  # temporally confirmed moving radar candidates. Static returns remain
  # diagnostic-only until a camera-confirmed initiation policy is validated.
  radar_initiation_enabled: true
  radar_initiation_shadow_mode: false
  radar_initiation_min_range: 2.0
  radar_initiation_max_range: 30.0
  radar_initiation_cluster_radius: 1.5
  radar_initiation_cluster_z_gate: 1.5
  radar_initiation_min_points: 2
  radar_initiation_required_frames: 2
  # V0.6.12.8.2.2.53: CARLA moving pedestrians often produce one MR76-like
  # radar return. Admit only moving single returns after a stricter 3-frame
  # confirmation; the road ROI and LiDAR dedupe gates still apply.
  radar_initiation_single_point_enabled: true
  radar_initiation_single_point_min_abs_speed: 0.20
  radar_initiation_single_point_required_frames: 3
  radar_initiation_single_point_ttl: 1.0
  # V0.6.12.8.2.2.54: diagnostic-only thresholds for every raw singleton.
  radar_initiation_single_speed_shadow_thresholds: [0.05, 0.10, 0.20, 0.40, 0.60]
  # V0.6.12.8.2.2.55: shadow-only comparison. A moving singleton seeds the
  # path; nearby singleton returns may continue it even when radial speed
  # becomes zero. Neither rule reaches Tracker or the public ObjectList.
  radar_initiation_seed_bridge_shadow_enabled: true
  radar_initiation_seed_bridge_required_frames: [2, 3]
  # V0.6.12.8.2.2.56: independent Shadow states reveal radar position jumps.
  radar_initiation_seed_bridge_match_gates: [2.5, 4.0, 6.0]
  # V0.6.12.8.2.2.57: determine whether a moving singleton becomes a
  # multi-return radar component on the next frame. Diagnostic-only.
  radar_initiation_seed_to_component_shadow_enabled: true
  radar_initiation_seed_to_component_match_gates: [2.5, 4.0]
  # V0.6.12.8.2.2.58: profile whether either camera can confirm a moving
  # radar singleton that is not already covered by LiDAR and passes road ROI.
  radar_initiation_camera_support_shadow_enabled: true
  # V0.6.12.8.2.2.61: locate generic camera detections on the road plane and
  # compare extra lateral margins for VRUs rejected by the normal road ROI.
  # Every variant remains evaluator-only and cannot enter Tracker/ObjectList.
  camera_ground_initiation_shadow_enabled: true
  camera_ground_initiation_min_range: 2.0
  camera_ground_initiation_max_range: 30.0
  camera_ground_initiation_min_confidence: 0.25
  camera_ground_initiation_dedupe_distance: 3.0
  camera_ground_initiation_cross_camera_distance: 2.0
  camera_ground_initiation_allowed_classes: [person, pedestrian, bicycle, motorcycle, car, truck, bus]
  camera_ground_vru_roi_extra_margin_shadow: [1.0, 2.0, 3.0]
  radar_initiation_match_gate: 2.5
  radar_initiation_ttl: 0.6
  radar_initiation_min_abs_speed: 0.6
  radar_initiation_speed_shadow_thresholds: [0.10, 0.20, 0.40, 0.60]
  radar_initiation_dedupe_distance: 3.0
  radar_initiation_max_candidates: 24
  radar_initiation_default_extent: [4.5, 1.8, 1.6]

  track_match_distance: 3.5
  track_max_age: 1.5
  track_max_speed: 20.0
  track_coast_frames: 4
  track_coast_confidence_decay: 0.84
  track_adaptive_coast_enabled: true
  track_coast_young_frames: 1
  track_coast_stable_frames: 3
  track_coast_far_frames: 4
  track_coast_stable_hits: 3
  track_coast_far_range: 50.0
  track_coast_low_score: 0.55
  track_coast_edge_ratio: 0.90

  track_quality_enabled: true
  track_quality_high: 0.72
  track_quality_medium: 0.47
  track_quality_medium_coast_frames: 2
  track_quality_low_coast_frames: 1
  track_quality_low_min_hits_for_coast: 3
  track_quality_camera_bonus: 0.12
  track_quality_radar_bonus: 0.08
  track_quality_sensor_memory: 1.5
  track_quality_coast_penalty: 0.10

  # V0.6.12: remove weak stale internal tracks so suppressed/coasting FP cannot resurrect.
  track_stale_cleanup_enabled: true
  track_stale_cleanup_min_misses: 2
  track_stale_cleanup_max_quality: 0.55
  track_stale_cleanup_sensor_memory: 1.5

  velocity_alpha: 0.25
  velocity_window: 5
  position_alpha: 0.45
  stationary_speed: 0.35
  extent_alpha: 0.25
  extent_shrink_alpha: 0.05
  extent_lock_hits: 5

  road_roi_margin: 3.0
  road_roi_margin_mid: 4.2
  road_roi_margin_far: 4.5
  road_roi_mid_range: 30.0
  road_roi_far_range: 50.0
  road_min_height: -1.0
  road_max_height: 2.8

  # V0.6.12.5: bounded 50-80m distance/evidence adaptive road corridor.
  far_roi_adaptive_corridor_enabled: true
  far_roi_adaptive_min_range: 50.0
  far_roi_adaptive_max_range: 80.0
  far_roi_adaptive_base_margin: 4.5
  far_roi_adaptive_max_margin: 5.5
  far_roi_adaptive_distance_extra: 1.0
  far_roi_adaptive_temporal_extra: 0.20
  far_roi_adaptive_sparse_points: 2
  far_roi_adaptive_sparse_penalty: 0.30
  far_roi_adaptive_half_width_extra: 0.30
  far_roi_adaptive_overlap_relax: 0.17
  far_roi_adaptive_min_overlap_floor: 0.08
  far_roi_adaptive_center_excess_extra: 0.80

  geometry_aware_roi_enabled: true
  geometry_aware_roi_min_range: 30.0
  geometry_aware_roi_min_overlap: 0.25
  geometry_aware_roi_max_center_excess: 1.8
  geometry_aware_roi_max_half_width: 1.8
  geometry_aware_roi_mid_min_overlap: 0.10
  geometry_aware_roi_mid_max_center_excess: 2.6
  geometry_aware_roi_mid_max_half_width: 2.0

  # Learn fixed map returns before benchmark targets are spawned. New static
  # hazards created after READY remain eligible for ObjectList.
  background_filter_enabled: true
  background_calibration_seconds: 6.0
  background_cell_size: 1.0
  background_occupancy_ratio: 0.45
  background_moving_radar_speed: 1.2
  background_neighbor_radius_cells: 2
  static_confirm_seconds: 3.0
  static_max_speed: 0.8

evaluation:
  enabled: true
  radius: 80.0
  range_bins: [30.0, 50.0, 80.0]
  match_distance: 4.0
  include_roles: [autopilot, roadside_autopilot, rsu_local_autopilot]
  include_walkers: true
  obstacle_actor_patterns: [static.prop.*, dynamic.prop.*]
  report_interval: 2.0
  # V0.6.12.8.2.2: evaluation-only gate simulation. These values never filter
  # perception candidates or alter ROI, Tracker and ObjectList.
  road_object_precision_gate_shadow: true
  road_object_gate_min_points: 10
  # V0.6.12.8.2.2.1: compare point thresholds in parallel without enforcement.
  road_object_gate_point_ablations: [8, 9, 10]
  road_object_gate_max_height: 0.45
  road_object_gate_max_range: 25.0
  # V0.6.12.8.2.2.2: evaluation-only raw support and recovery-stage attribution.
  road_object_raw_support_radius: 1.50
  road_object_stage_match_distance: 2.00
  road_object_stage_range_bins: [25.0, 35.0, 45.0]
  # V0.6.12.8.2.2.7: discard pre-spawn cumulative samples when a tagged batch appears.
  road_object_benchmark_session_isolation: true
  # V0.6.12.8.2.2.5: profile Adaptive pre-cap truth/FP scalar features only.
  road_object_adaptive_feature_profiling: true
  # V0.6.12.8.2.2.10: source/class feature profiles for selected Hybrid candidates.
  road_object_hybrid_feature_profiling: true
  # V0.6.12.8.2.2.13.1: activate incremental Rescue profiling in evaluation.
  road_object_hybrid_rescue_feature_profiling: true
  # V0.6.12.8.2.2.20: compare selected score gates without filtering runtime.
  selected_admission_score_profiling: true
  selected_admission_score_thresholds: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45]
  selected_track_admission_profiling: true
  # V0.6.12.8.2.2.27: profile camera support for held candidates. The result is
  # evaluator-only and never feeds Selected admission, Fusion or Tracker.
  selected_track_admission_camera_profiling: true
  # V0.6.12.8.2.2.30: remove current-frame base confirmations from delayed
  # profiles before measuring incremental rescue risk.
  selected_delayed_reappearance_base_duplicate_gate: 0.05
  # V0.6.12.8.2.2.32: sensor-only risk gates over incremental delayed events.
  # Evaluation-only: these never filter Fusion or Tracker input.
  selected_delayed_reappearance_risk_gate_ablations:
    - {name: sparse_strict, max_score: 0.35, max_origin_score: 0.35, max_points: 3, max_origin_points: 3, max_height: 0.20}
    - {name: sparse_moderate, max_score: 0.40, max_origin_score: 0.40, max_points: 4, max_origin_points: 4, max_height: 0.25}
    - {name: sparse_wide, max_score: 0.45, max_origin_score: 0.45, max_points: 5, max_origin_points: 5, max_height: 0.40}
    - {name: sparse_slow, max_score: 0.40, max_origin_score: 0.40, max_points: 4, max_origin_points: 4, max_height: 0.25, max_apparent_speed: 0.50}
  # V0.6.12.8.2.2.34: prevent a single optimistic run from promoting a delayed
  # policy. This evaluator-only verdict never changes Tracker/Fusion/ObjectList.
  selected_delayed_reappearance_deployment_verdict_shadow: true
  selected_delayed_reappearance_deployment_rule: ttl075_gate25
  selected_delayed_reappearance_deployment_risk_gate: sparse_slow
  selected_delayed_deployment_min_candidates: 20
  selected_delayed_deployment_min_precision: 0.85
  selected_delayed_deployment_min_truth_retention: 0.60
  selected_delayed_deployment_min_expired_only_actors: 1
  selected_delayed_deployment_min_expired_only_person_actors: 1
  # V0.6.12.8.2.2.28: compare strong person-camera support rules and unique
  # Expired-Only actor rescue coverage. These are Shadow-only ablations.
  selected_track_admission_camera_rescue_ablations:
    - {name: iou05_or_d30, min_iou: 0.05, max_center_distance: 30.0, allowed_classes: [person, pedestrian]}
    - {name: iou05_or_d45, min_iou: 0.05, max_center_distance: 45.0, allowed_classes: [person, pedestrian]}
    - {name: iou10_or_d45, min_iou: 0.10, max_center_distance: 45.0, allowed_classes: [person, pedestrian]}
    - {name: detector_d90, min_iou: 0.05, max_center_distance: 90.0, allowed_classes: [person, pedestrian]}
    - {name: detector_d100, min_iou: 0.05, max_center_distance: 100.0, allowed_classes: [person, pedestrian]}
    - {name: detector_d105, min_iou: 0.05, max_center_distance: 105.0, allowed_classes: [person, pedestrian]}
    - {name: detector_d110, min_iou: 0.05, max_center_distance: 110.0, allowed_classes: [person, pedestrian]}
  # V0.6.12.8.2.2.35: promote camera rescue only after the same scalar rule is
  # validated with the real detector source. CARLA truth may prove simulation
  # potential but must produce BLOCKED(camera_source).
  selected_camera_rescue_deployment_verdict_shadow: true
  selected_camera_rescue_deployment_rule: detector_d90
  selected_camera_rescue_required_source: detector
  selected_camera_rescue_min_expired_person_samples: 20
  # V0.6.12.8.2.2.45: total expired samples are not deployment evidence when
  # only a few of them actually pass the candidate rescue rule.
  selected_camera_rescue_min_kept_person_samples: 5
  # V0.6.12.8.2.2.46: require enough projected in-frame opportunities before
  # interpreting detector association precision as deployable evidence.
  selected_camera_rescue_min_visible_person_samples: 5
  selected_camera_rescue_min_kept_precision: 0.80
  selected_camera_rescue_min_expired_fp_rejection: 0.98
  selected_camera_rescue_min_person_actor_coverage: 0.50
  selected_camera_rescue_min_confirm_fp_rejection: 0.99
  # V0.6.12.8.2.2.14: parallel Shadow gates; no candidate is filtered.
  road_object_rescue_near_area_ablations: [0.02, 0.04, 0.06, 0.08]
  road_object_rescue_far_range_ablations: [26.0, 28.0, 30.0, 32.0]
  # Track benchmark actor entry, boundary exit, unexpected disappearance and jumps.
  truth_lifecycle_diagnostics: true
  truth_lifecycle_boundary_margin: 10.0
  truth_lifecycle_teleport_distance: 8.0
  # V0.6.12.7.2: truth attribution is evaluation-only and never feeds admission.
  far_admission_decision_diagnostics: true
  # V0.6.12.7.3: compare truth/FP score, geometry and source distributions.
  far_admission_feature_profiling: true
  # V0.6.12.7.4: evaluation-only edge/source risk gate; never filters Tracker input.
  far_admission_edge_risk_shadow: true
  far_admission_edge_hard_ratio: 0.65
  far_admission_edge_soft_ratio: 0.35
  far_admission_edge_soft_score: 0.68
  far_admission_edge_risk_modes: [far_geometry_builder, far_discovery_far]
  roi_false_reject_diagnostics: true
  roi_false_reject_min_range: 30.0
  roi_false_reject_max_range: 50.0
  roi_false_reject_max_print: 6

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  topic_object_list: roadside/RSU_001/object_list
  topic_rsm: roadside/RSU_001/rsm
  # Confirm the writable device-side topic with Dachuan before production use.
  topic_event: roadside/RSU_001/event2hmi

output_diagnostics:
  fused_json_sample_enabled: true
  fused_json_sample_interval: 5.0

v2x_events:
  enabled: true
  cooldown_seconds: 5.0
  # Leave unset in normal perception runs. A real OBU adapter will provide it.
  test_ego_speed_kmh:
  avw:
    enabled: true
    max_stationary_speed_mps: 0.5
    dwell_seconds: 5.0
    direction: 1
  slw:
    enabled: true
    speed_limit_kmh: 40
